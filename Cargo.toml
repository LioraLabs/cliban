[workspace]
resolver = "2"
members = ["crates/cliban-core", "crates/cliban-tui", "crates/cliban", "crates/cliban-server", "crates/cliban-tenancy", "crates/cliban-sync"]

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/LioraLabs/cliban"
homepage = "https://github.com/LioraLabs/cliban"

[workspace.dependencies]
cliban-core = { path = "crates/cliban-core", version = "0.7.0" }
cliban-tui = { path = "crates/cliban-tui", version = "0.7.0" }
cliban-tenancy = { path = "crates/cliban-tenancy", version = "0.7.0" }
cliban-sync = { path = "crates/cliban-sync", version = "0.7.0" }
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
russh = "0.62"
rand = "0.10"
toml = "1"
ratatui = "0.29"
