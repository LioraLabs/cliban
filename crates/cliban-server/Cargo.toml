[package]
name = "cliban-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "cliban SSH daemon (cliband): russh listener, host key, TOML config"
keywords = ["kanban", "ssh", "daemon", "tui"]
categories = ["command-line-utilities", "development-tools"]
readme = "../../README.md"

[lib]
name = "cliban_server"
path = "src/lib.rs"

[[bin]]
name = "cliband"
path = "src/main.rs"

[dependencies]
russh.workspace = true
rand.workspace = true
toml.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["signal", "net"] }
clap = { version = "4", features = ["derive"] }
cliban-tenancy.workspace = true
cliban-core.workspace = true
cliban-tui.workspace = true
ratatui.workspace = true
chrono.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["signal", "net", "time"] }
