[package]
name = "cliban"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Self-hosted, agent-first kanban for the terminal: flat CLI, ratatui board, SQLite storage"
keywords = ["kanban", "cli", "tui", "issue-tracker", "agents"]
categories = ["command-line-utilities", "development-tools"]
readme = "../../README.md"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/cliban-v{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "cliban-v{ version }-{ target }/{ bin }{ binary-ext }"

[[bin]]
name = "cliban"
path = "src/main.rs"

[features]
default = ["linear"]
# The Linear bridge (`cliban import linear`, `cliban push linear`). On by
# default so every install route has the commands; `--no-default-features`
# drops the HTTP/TLS dependency tree for a lean build.
linear = ["dep:cliban-sync"]

[dependencies]
cliban-core.workspace = true
cliban-tui.workspace = true
cliban-sync = { workspace = true, optional = true }
clap = { version = "4", features = ["derive"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
rusqlite.workspace = true
regex = "1"
