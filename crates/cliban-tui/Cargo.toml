[package]
name = "cliban-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "cliban TUI: a ratatui kanban board over in-process cliban-core"
keywords = ["kanban", "tui", "ratatui", "terminal"]
categories = ["command-line-interface", "development-tools"]
readme = "../../README.md"

[dependencies]
cliban-core.workspace = true
ratatui = { workspace = true, features = ["unstable-backend-writer"] }
crossterm = "0.28"
tokio = { workspace = true }
chrono.workspace = true

[[bin]]
name = "cliban-tui"
path = "src/bin/cliban-tui.rs"
